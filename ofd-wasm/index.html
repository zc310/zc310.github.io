<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OFD WASM 阅读器已迁移</title>
<meta name="description" content="OFD WASM 阅读器已迁移到 zc310/ofd 仓库，本页面 6 秒后自动跳转。">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://zc310.github.io/ofd/wasm/">
<link rel="icon" href="https://zc310.github.io/ofd/wasm/icon.svg" type="image/svg+xml">
<meta http-equiv="refresh" content="6; url=https://zc310.github.io/ofd/wasm/">
<style>
  :root {
    color-scheme: light dark;
    --navy: #172033;
    --surface: #ffffff;
    --bg: #f2f5f9;
    --line: #dde4ee;
    --ink: #172033;
    --muted: #667188;
    --accent: #2476bd;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #1a2130;
      --bg: #11151f;
      --line: #2b3547;
      --ink: #e6ebf2;
      --muted: #a3aec2;
      --accent: #5fa8e6;
    }
  }
  * { box-sizing: border-box; }
  body {
    display: grid;
    min-height: 100vh;
    margin: 0;
    padding: 24px;
    place-items: center;
    background: var(--bg);
    color: var(--ink);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.7;
  }
  .card {
    width: 100%;
    max-width: 34em;
    padding: 32px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--surface);
    box-shadow: 0 6px 18px rgba(23, 32, 51, .07);
    text-align: center;
  }
  h1 { margin: 0 0 12px; font-size: 22px; }
  p { margin: 0 0 20px; color: var(--muted); font-size: 15px; }
  .countdown {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 24px;
    color: var(--muted);
    font-size: 14px;
  }
  .countdown strong {
    min-width: 2.2em;
    padding: 2px 8px;
    border-radius: 6px;
    background: var(--bg);
    color: var(--accent);
    font-size: 22px;
    font-variant-numeric: tabular-nums;
  }
  .bar {
    height: 3px;
    margin-bottom: 24px;
    overflow: hidden;
    border-radius: 2px;
    background: var(--line);
  }
  .bar i {
    display: block;
    width: 100%;
    height: 100%;
    background: var(--accent);
    transform-origin: left;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    padding: 0 22px;
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    font: inherit;
    font-weight: 600;
    text-decoration: none;
  }
  .btn:hover { background: #3b82c4; color: #fff; }
  a:not(.btn) { color: var(--accent); }
  footer { margin-top: 20px; color: var(--muted); font-size: 13px; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
  <main class="card">
    <h1>阅读器已迁移</h1>
    <p>OFD WASM 阅读器现在由 <a href="https://github.com/zc310/ofd" rel="noopener">zc310/ofd</a> 仓库发布和维护，功能与页面地址均有更新。</p>
    <div class="countdown">
      <strong id="left">6</strong>
      <span>秒后自动跳转</span>
    </div>
    <div class="bar" aria-hidden="true"><i id="bar"></i></div>
    <a class="btn" href="https://zc310.github.io/ofd/wasm/">立即打开阅读器</a>
    <footer>
      新地址：<a href="https://zc310.github.io/ofd/wasm/" rel="noopener">zc310.github.io/ofd/wasm/</a><br>
      项目源码与文档：<a href="https://github.com/zc310/ofd" rel="noopener">github.com/zc310/ofd</a>
    </footer>
  </main>
  <script>
    (function () {
      var target = 'https://zc310.github.io/ofd/wasm/';
      var total = 6;
      var left = document.getElementById('left');
      var bar = document.getElementById('bar');
      var start = Date.now();
      var done = false;

      function go() {
        if (done) return;
        done = true;
        location.replace(target);
      }

      function tick() {
        var remain = Math.max(0, total - (Date.now() - start) / 1000);
        left.textContent = Math.ceil(remain);
        bar.style.transform = 'scaleX(' + (remain / total) + ')';
        if (remain <= 0) go();
        else requestAnimationFrame(tick);
      }

      // 进度条回退到起点后再做倒计时，避免第一帧闪烁
      bar.style.transform = 'scaleX(1)';
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
