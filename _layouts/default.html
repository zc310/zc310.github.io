<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172033" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#11151f" media="(prefers-color-scheme: dark)">
  {% seo %}
  <link rel="icon" href="{{ '/assets/images/icon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.github.build_revision }}">
</head>
<body class="page">
  <a class="skip" href="#main">跳到主要内容</a>

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">
        <img src="{{ '/assets/images/icon.svg' | relative_url }}" alt="" width="30" height="30">
        <span>彩票号码分析助手</span>
      </a>
      <nav class="site-nav" aria-label="主导航">
        {%- for item in site.nav %}
        <a href="{{ item.url | relative_url }}"{% if page.nav == item.nav %} aria-current="page"{% endif %}>{{ item.title }}</a>
        {%- endfor %}
        <a class="btn btn-sm" href="{{ site.share_weiyun_url }}" rel="noopener">下载</a>
      </nav>
    </div>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <div>
        <p class="footer-brand">彩票号码分析助手</p>
        <p class="footer-note">免费的开奖号码查询与走势分析工具</p>
      </div>
      <nav class="footer-links" aria-label="页脚导航">
        <a href="{{ '/changelog.html' | relative_url }}">更新记录</a>
        <a href="https://zc310.github.io/ofd/wasm/">OFD WASM 阅读器</a>
        <a href="{{ '/privacy/rich_helper.html' | relative_url }}">隐私政策（号码助手）</a>
        <a href="{{ '/privacy/boltdb.viewer.html' | relative_url }}">隐私政策（BoltDB Viewer）</a>
        <a href="http://zc310.tech/blog/about/">联系我</a>
      </nav>
    </div>
    <p class="footer-copy">© zc310 · 由 GitHub Pages 托管</p>
  </footer>
</body>
</html>
